version: "3.8"

services:
  api:
    build:
      context: "./server"
      dockerfile: Dockerfile
    container_name: arcgis_oauth2_api
    restart: unless-stopped
    ports:
      - "3080:3080"
    env_file:
      - "./server/.env"

  ui:
    build:
      context: "./client"
      dockerfile: Dockerfile
    container_name: arcgis_oauth2_client
    restart: unless-stopped
    ports:
      - "3080:3080"
    env_file:
      - "./server/.env"
